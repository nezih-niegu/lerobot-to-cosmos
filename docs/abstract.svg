<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">lerobot-to-cosmos: visual abstract</title>
<desc id="desc">A LeRobot v3.0 dataset (100 episodes, 4 cameras including depth, 30 fps, stored as long shared videos) is cut into one clip per episode and camera, resampled to 5 fps and 256 by 256, with depth rendered as grayscale, written in the NVIDIA Cosmos3 video-SFT layout (400 clips, a JSONL index, captions and validation prompts), then checked with NVIDIA's own data loader, optionally trained for a few steps on GPUs, and uploaded to the Hugging Face Hub.</desc>
